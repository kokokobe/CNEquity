# English for every Click option help text, keyed by the Chinese original.
# scripts/dev/sync_docs.py renders docs/en/reference/cli-options.md from it;
# --check fails when a help text changes and its entry is missing.
"配置文件路径。": "Path to the config file."
"整个湖的健康快照（当前状态 + 新鲜度），而不是某一次 run 的文件。": "Health snapshot of the whole lake (current state + freshness), not the files of a single run."
"严格校验从这一天开始的研究窗口（需要 --full）。": "Strictly validate the research window starting on this date (requires --full)."
"配合 --full：只按质量 error 判门禁；调度新鲜度请另外用 status 检查。": "With --full: gate only on quality errors; check schedule freshness separately with status."
"研究窗口终点（默认取最新的 daily_bars；需要 --research-start）。": "End of the research window (defaults to the latest daily_bars; requires --research-start)."
"--full 检查的历史研究 universe。": "Historical research universe checked by --full."
"daily_bars 可选 delisted：只回填已确认退市名录，沿用独立发现证据。": "daily_bars accepts delisted: backfill only the confirmed delisting list, reusing the independent discovery evidence."
"仅期货/期权日线：从已核验格式的本地上期所年度 ZIP 离线导入。": "Futures/options daily bars only: import offline from a local SHFE annual ZIP in a verified format."
"年度 ZIP 对应的交易年份。": "Trading year covered by the annual ZIP."
"明确接受年度包缺少日文件独有字段；已有完整日线不会被覆盖。": "Explicitly accept that the annual package lacks fields found only in the daily files; existing complete daily bars are not overwritten."
"可选：该 ZIP 在上期所网站上的原始 HTTPS 链接，仅写证据。": "Optional: the original HTTPS URL of this ZIP on the SHFE website; written to evidence only."
"可选：已知的原始下载时间，带时区 ISO 8601。": "Optional: known original download time, ISO 8601 with time zone."
"只输出来源、范围和抓取方式；衍生品另给请求预算。不取数、不写湖。": "Print only sources, scope and fetch method, plus a request budget for derivatives. Fetches no data and does not write the lake."
"仅衍生品：限定交易所，可重复。INE 归入 SHF 路由；2018 期货另取 INE 日文件。": "Derivatives only: restrict to an exchange; repeatable. INE is routed via SHF; 2018 futures also fetch INE daily files."
"仅衍生品日线：忽略完成收据与响应缓存，重新核对指定区间；不绕过熔断。": "Derivatives daily bars only: ignore completion receipts and the response cache and re-check the given range; does not bypass circuit breakers."
"续跑 sector_bars 回填（跳过 checkpoint 里已写过的板块）。": "Resume the sector_bars backfill (skip sectors already written in the checkpoint)."
"清掉 sector_bars 回填 checkpoint，重抓全部板块。": "Clear the sector_bars backfill checkpoint and refetch all sectors."
? "回填区间起点（YYYY-MM-DD），包括 daily_bars、minute_bars、衍生品日线、日期/报告期推进及 sector_bars。sector_bars 默认往前 400 天；超过来源历史深度的范围保留为缺口，可取范围照常交付并提供补数指引。"
: "Backfill start date (YYYY-MM-DD), covering daily_bars, minute_bars, derivatives daily bars, date/report-period advancement and sector_bars. sector_bars defaults to 400 days back; ranges beyond the source's history depth are kept as gaps, while the available range is delivered as usual with guidance for filling the rest."
"回填区间终点（YYYY-MM-DD，默认今天），与 --start 配合限定历史窗口。": "Backfill end date (YYYY-MM-DD, default today); with --start, bounds the historical window."
"只修复被容忍缺口欠下的那些 key，范围和窗口都取自欠账台账，不看 --symbols/--start/--end。补上的 key 会销账，仍然缺的继续欠着。": "Repair only the keys owed by tolerated gaps; scope and window come from the debt ledger, ignoring --symbols/--start/--end. Filled keys are cleared from the ledger; keys still missing stay owed."
? "限定范围的标的列表，逗号分隔：用于 intraday、trading_status、corporate_actions 的限定回填，以及 financial_statement_items、daily_bars、share_structure 的限定修复。trading_status 的 checkpoint 与覆盖证据会记下确切范围；daily_bars 会把这个显式范围写进 backfill 元数据。"
: "Comma-separated symbols to restrict the scope: for scoped backfills of intraday, trading_status and corporate_actions, and scoped repairs of financial_statement_items, daily_bars and share_structure. trading_status records the exact scope in its checkpoint and coverage evidence; daily_bars writes this explicit scope into the backfill metadata."
"仅 margin_trading 的日期推进并发数。每个请求仍然走配置里共享的源限流器；其它数据集必须为 1。": "margin_trading only: concurrency for date advancement. Each request still goes through the shared source rate limiter from the config; must be 1 for other datasets."
"仅 margin_trading：本次回填使用的来源，不修改配置文件或来源限速。": "margin_trading only: source to use for this backfill, without changing the config file or source rate limits."
"仅 corporate_actions：先应用已审发行人公告，再用 Baostock 匹配真实派息日；早于除息日的付款日视为未知。": "corporate_actions only: apply reviewed issuer announcements first, then match actual payment dates with Baostock; payment dates earlier than the ex-date are treated as unknown."
"仅 corporate_actions：只用发行人实施公告（已审清单、巨潮、北交所）修复付款日和已审送转条款；未匹配事件保留缺口，不请求 Baostock。": "corporate_actions only: repair payment dates and reviewed bonus/transfer share terms using issuer implementation announcements only (reviewed list, CNINFO, BSE); unmatched events stay as gaps and Baostock is not queried."
"仅 corporate_actions：用 Baostock 显式修复已退市的沪深标的。": "corporate_actions only: explicitly repair delisted Shanghai and Shenzhen symbols with Baostock."
"仅 corporate_actions，历史迁移用：用同花顺补已退市北交所标的的历史分红除权。": "corporate_actions only, for historical migration: fill historical dividends and ex-rights of delisted BSE symbols from THS."
"仅 corporate_actions，历史迁移用：通过现行的 920xxx 东财代码补北交所老代码的历史分红除权。": "corporate_actions only, for historical migration: fill historical dividends and ex-rights of old BSE codes via the current 920xxx EastMoney codes."
"仅 corporate_actions：按 --ex-dates 指定的除权日向东财逐日要历史除权行。回补路径的主源是 TDX，东财只有日更的等值过滤能取到 2015-09-29 以前的行。": "corporate_actions only: request historical ex-rights rows from EastMoney day by day for the ex-dates given in --ex-dates. The primary source for the backfill path is TDX; only EastMoney's daily-update equality filter can reach rows before 2015-09-29."
"配合 --eastmoney-date-repair：逗号分隔的除权日 YYYY-MM-DD。": "With --eastmoney-date-repair: comma-separated ex-dates, YYYY-MM-DD."
"仅 daily_bars，历史迁移用：用北交所官网补已有当期交易日的 BJ 成交额，不重抓 Sina。日更已以北交所行情板为 BJ 当期主源。": "daily_bars only, for historical migration: fill BJ turnover for existing current-period trading days from the BSE website without refetching Sina. Daily updates already use the BSE quote board as the primary current-period source for BJ."
"仅 daily_bars，已由 --tdx-amount-repair 取代：从 TDX 补 Sina 从未发布过的北交所成交额，已存的价格和成交量一律不动。需要 --start/--end。": "daily_bars only, superseded by --tdx-amount-repair: fill BSE turnover that Sina never published from TDX; stored prices and volumes are never touched. Requires --start/--end."
"仅 daily_bars：新浪补上的沪深北历史行与通达信一起核对，只在开高低收一致且成交量差小于一手时补成交额；通达信没有的代码保留新浪行。已存的价格和成交量一律不动。需要 --start/--end。": "daily_bars only: cross-check historical Shanghai, Shenzhen and Beijing rows filled from Sina against TDX, filling turnover only when OHLC match and the volume difference is under one lot; codes TDX lacks keep the Sina rows. Stored prices and volumes are never touched. Requires --start/--end."
"仅 daily_bars：重读 TDX，只改写已存 TDX 行的成交量（修 2026-09-17 前的解码错误）；价格须一致，64.5 元以下被放大的成交额一并改写；不新增行。需要 --symbols 和 --start/--end。": "daily_bars only: re-read TDX and rewrite only the volume of stored TDX rows (fixes the decoding bug before 2026-09-17); prices must match, and turnover values under 64.5 yuan, which the same bug inflated, are rewritten too; adds no rows. Requires --symbols and --start/--end."
"仅 daily_bars：成交额缺失、为 0 或量额单位错位的沪深股票行，用 Baostock 同日行整行替换；开高低收须在半分钱内一致，不一致或未提供的保留原值。需要 --start/--end。": "daily_bars only: replace Shanghai/Shenzhen stock rows whose turnover is missing, zero or has misaligned volume/amount units with the whole same-day Baostock row; OHLC must agree within half a cent, otherwise or if unavailable the original values are kept. Requires --start/--end."
"仅 valuation_metrics：东财快照中断时，用东财 datacenter 估值报表补东财最后一个完整日之后、今天之前的 --start/--end 窗口；全市场取全才写入。": "valuation_metrics only: when the EastMoney snapshot is interrupted, fill the --start/--end window after EastMoney's last complete day and before today from the EastMoney datacenter valuation report; writes only when the whole market is retrieved."
"立即重跑全湖审计（读每个历史分区，大湖可能要数小时）；默认读最近一次的审计结果。": "Rerun the full-lake audit now (reads every historical partition; can take hours on a large lake); by default reads the latest audit result."
"按研究包给出窗口、缺口和下一步。可重复。指定后，缺数据或历史 ST 未覆盖会使退出码变差。": "Report window, gaps and next steps per research pack. Repeatable. When given, missing data or uncovered historical ST worsens the exit code."
"action=create 时覆盖已存在的配置文件。": "With action=create: overwrite an existing config file."
"action=create 时设置 [data].root（默认把 ./data/cnequity 解析成绝对路径）。": "With action=create: set [data].root (defaults to ./data/cnequity resolved to an absolute path)."
"action=upgrade 时只列出要补的 step 和调度组，不写文件。": "With action=upgrade: only list the steps and schedule groups to add; writes no files."
"基线契约文件路径。": "Path to the baseline contract file."
"候选契约文件路径。": "Path to the candidate contract file."
"--old 的别名。": "Alias for --old."
"--new 的别名。": "Alias for --new."
"输出机器可读的 JSON。": "Output machine-readable JSON."
"即使发现破坏性变更也返回退出码 0。": "Exit with code 0 even when breaking changes are found."
"数据集名（也可以直接作为参数传）。不给则输出完整契约。": "Dataset name (can also be passed as an argument). Omit to print the full contract."
"把 JSON 写到这个路径而不是标准输出；'-' 表示打印。": "Write the JSON to this path instead of stdout; '-' means print."
"输出机器可读的 JSON（默认）。": "Output machine-readable JSON (default)."
"契约 JSON 路径（也可以直接作为参数传）。": "Path to the contract JSON (can also be passed as an argument)."
"要求文件里的契约与当前的 DATASETS / SCHEMAS / PRIMARY_KEYS 完全一致。": "Require the contract in the file to match the current DATASETS / SCHEMAS / PRIMARY_KEYS exactly."
"默认今天；配置了 [research] holdout_start 时默认其前一天。": "Defaults to today; when [research] holdout_start is configured, defaults to the day before it."
"湖窗口起点。": "Start of the lake window."
"打印多少行明细。": "Number of detail rows to print."
"重写 adj_factors / industry_index / option_greeks / minute_bars_15m|30m|60m 的全部分区（默认只补增量）。": "Rewrite all partitions of adj_factors / industry_index / option_greeks / minute_bars_15m|30m|60m (default: incremental only)."
"industry_index / trading_status / option_greeks / minute_bars_15m|30m|60m：只派生这个日期（YYYY-MM-DD）及之后的。": "industry_index / trading_status / option_greeks / minute_bars_15m|30m|60m: derive only this date (YYYY-MM-DD) and later."
"industry_index / trading_status / option_greeks / minute_bars_15m|30m|60m：只派生这个日期（YYYY-MM-DD）及之前的。": "industry_index / trading_status / option_greeks / minute_bars_15m|30m|60m: derive only this date (YYYY-MM-DD) and earlier."
"bse_code_migration：真正重写分区；adj_factor_source：写入逐证券来源覆盖并重算这些证券的因子（默认只报告）。": "bse_code_migration: actually rewrite partitions; adj_factor_source: write per-security source overrides and recompute factors for those securities (default: report only)."
? "建多大。demo = 用真实数据源抓几只票，sample = 同样的形状但离线且确定 —— 两者都不是一个市场。quick = 全市场标的、最近 3 年；full = 全市场标的、从 2016-01-01 起（通常需要更多分页）。以后可以用 `cne backfill daily_bars` 补深。"
: "How big to build. demo = fetch a few symbols from real sources; sample = the same shape but offline and deterministic — neither is a market. quick = all symbols, last 3 years; full = all symbols since 2016-01-01 (usually needs more pages). You can deepen history later with `cne backfill daily_bars`."
"demo/sample：要抓的标的，逗号分隔（有意保持很少）。": "demo/sample: symbols to fetch, comma-separated (deliberately few)."
"demo/sample：daily_bars 大致抓最近多少个交易日。": "demo/sample: roughly how many recent trading days of daily_bars to fetch."
"demo/sample：独立的湖根目录（不要拿去跑全市场 init）。": "demo/sample: separate lake root (do not use it for a full-market init)."
"demo/sample：把那份小配置写到哪，供后续 `cne query` 使用。": "demo/sample: where to write the small config for later `cne query` use."
"demo/sample：允许覆盖内容不同的已有 --config-out；默认拒绝并保留原文件。": "demo/sample: allow overwriting an existing --config-out with different content; by default refuses and keeps the original file."
"demo/sample：同一批标的额外抓 1 分钟线（最多 5 个交易日）并打印一个交易日，让 bar_time 的口径看得见。": "demo/sample: also fetch 1-minute bars for the same symbols (up to 5 trading days) and print one trading day, so the bar_time convention is visible."
"demo/sample：额外用 Sina 派生 hfq 复权因子，并打印未复权 / 复权收益对照（较慢；需要访问 Sina）。": "demo/sample: also derive hfq adjustment factors from Sina and print an unadjusted vs. adjusted return comparison (slower; needs access to Sina)."
"只建目录、manifest 和 DuckDB 视图，跳过 init 各阶段。": "Create only directories, the manifest and DuckDB views; skip the init stages."
"init 各阶段的 as-of 交易日（YYYY-MM-DD）；默认今天。": "As-of trading day (YYYY-MM-DD) for the init stages; defaults to today."
"续跑最近一次没跑完的 init run（重试失败批次 + 补缺失阶段）。": "Resume the most recent unfinished init run (retry failed batches + fill missing stages)."
"续跑指定的 init run_id（隐含 --resume）。": "Resume the given init run_id (implies --resume)."
"某个阶段失败后继续往下跑，而不是停下来。": "Keep going after a stage fails instead of stopping."
"显式指定历史起点（YYYY-MM-DD）；覆盖 --profile。": "Explicit history start (YYYY-MM-DD); overrides --profile."
"只留 warning 及以上，不打逐批进度。": "Show only warnings and above; no per-batch progress."
? "研究包：market 行情、fundamentals 基本面、universe 历史 ST。不改变这次初始化下载的内容。决定结束后要保持更新的调度组，以及 `cne check --pack` 的结论。可重复。不写则沿用已保存的选择，第一次是 market。"
: "Research pack: market (market data), fundamentals, universe (historical ST). Does not change what this init downloads. Decides which schedule groups stay updated afterward and the verdict of `cne check --pack`. Repeatable. If omitted, the saved selection is reused; the first time it is market."
"初始化成功结束后，为所选研究包安装定时日更和收尾补抓。不含公告和资讯。": "After init succeeds, install the scheduled daily update and closing catch-up for the selected research packs. Excludes announcements and news."
"湖里没有的数据就按需向源头取，并且不落盘。只支持标的查找和未复权日线；其它工具宁可拒绝，也不会在没有复权、universe 和 PIT 的情况下作答。": "Fetch data missing from the lake on demand from the source, without writing it to disk. Supports only symbol lookup and unadjusted daily bars; other tools refuse rather than answer without price adjustment, universe and PIT."
"改用 Streamable HTTP，在 /mcp 上监听。给只接远程 URL 的客户端（如 ChatGPT）配合隧道使用。": "Use Streamable HTTP instead, listening on /mcp. For clients that only accept a remote URL (such as ChatGPT), used with a tunnel."
"--http 的监听地址。非回环地址必须配 --token。": "Listen address for --http. A non-loopback address requires --token."
"--http 的端口。": "Port for --http."
"--http：每个请求都要带这个令牌（Bearer 头、/mcp/<令牌> 路径或 ?token=）。经隧道公开时必须设置。": "--http: every request must carry this token (Bearer header, /mcp/<token> path or ?token=). Required when exposed publicly through a tunnel."
"列表里包含历史遗留的 universe 别名。": "Include legacy universe aliases in the list."
"把 profile 绑定到具体标的，并附带 concrete_scope_hash。": "Bind the profile to concrete symbols and include concrete_scope_hash."
"按需抓取的数据集名": "Dataset name to fetch on demand"
"按需抓取的标的代码": "Symbol to fetch on demand"
"抓取前先刷新按需缓存（需要同时给 --dataset 和 --symbol）。": "Refresh the on-demand cache before fetching (requires both --dataset and --symbol)."
"向 Baostock 补取并发布新版本；默认只离线输出计划。": "Fetch from Baostock and publish a new version; by default only prints the plan offline."
"写入并发布新版本；默认只输出计划。": "Write and publish a new version; by default only prints the plan."
"核验后发布新版本；默认只输出计划。": "Publish a new version after verification; by default only prints the plan."
"兼容选项；现在所有清理均只预览。": "Compatibility option; all cleanup is now preview-only."
"预览超过这么多天、且 manifest 里没有记录的孤儿 staging。": "Preview orphan staging older than this many days that is not recorded in the manifest."
"预览超过这么多天的 meta/source_snapshots run_id 目录（每个数据集 / 源的最新一份始终保留）。": "Preview meta/source_snapshots run_id directories older than this many days (the latest one per dataset / source is always kept)."
"将未完成或未 compact 的 staging 也列入预览，不删除文件、不降级批次。": "Also include unfinished or uncompacted staging in the preview; deletes no files and does not downgrade batches."
"每个数据集保留最近这么多代及 current/hold；其他版本只列出候选，不标记、不释放字节。网页标记前须导入引用清单。0 表示跳过版本处理。": "Keep the latest this many generations plus current/hold per dataset; other versions are only listed as candidates, not marked, and no bytes are freed. Import a reference manifest before marking in the web UI. 0 skips version handling."
"预览超过这么多天的 `logs/cne-*.log`，不删除；0 表示跳过。": "Preview `logs/cne-*.log` older than this many days, without deleting; 0 skips."
"清理前，把卡在 'running'（worker 崩溃）的 run 标成 failed。": "Before cleanup, mark runs stuck in 'running' (crashed worker) as failed."
"只对静默超过这么多秒的 run 做上面的对账（默认取 [orchestrator].batch_stale_seconds）。": "Apply the reconciliation above only to runs silent for more than this many seconds (defaults to [orchestrator].batch_stale_seconds)."
"只发布这一次 run；默认处理所有待发布的 run。": "Publish only this run; by default handles all runs pending publication."
"把 --stale-only 限定在这些 daily 调度组内（逗号或空格分隔）。": "Restrict --stale-only to these daily schedule groups (comma- or space-separated)."
"调度组：core、capital、signals、fundamentals、macro_risk、research、intraday、ticks": "Schedule groups: core, capital, signals, fundamentals, macro_risk, research, intraday, ticks"
"只跑全部调度组，不含事件流。给已经单独调度 `cne run events` 的旧定时任务保留；不带参数的 `cne run daily` 已经包含全部调度组和事件流。": "Run all schedule groups only, without the event streams. Kept for old schedules that run `cne run events` separately; `cne run daily` without arguments already includes all schedule groups and event streams."
"只跑 [[job.daily.waves]] 核心骨架（旧版不带参数时的行为）。": "Run only the [[job.daily.waves]] core skeleton (the old no-argument behavior)."
"不带参数运行时不跑事件流（公告、监管事件、资讯）。": "When run without arguments, skip the event streams (announcements, regulatory events, news)."
"as-of 交易日 YYYY-MM-DD（默认今天）。周末 / 节假日补跑时用。": "As-of trading day YYYY-MM-DD (default today). Use for catch-up runs on weekends / holidays."
"用 backfill 语义跑：跳过交易日门禁和每个 step 自己的增量窗口，改为抓配置里 backfill scope 指定的窗口。用于补跑调度漏掉的某一天；日常调度从不带这个参数。": "Run with backfill semantics: skip the trading-day gate and each step's own incremental window, and fetch the window given by the backfill scope in the config instead. Used to rerun a day the schedule missed; scheduled runs never pass it."
"在 daily / stale 跑之前，先修复已验证、且有诚实来源的历史缺口。": "Before the daily / stale run, repair verified historical gaps that have an honest source."
"只留 warning 及以上，不打逐步进度。": "Show only warnings and above; no per-step progress."
"只重抓仍然落后于最后交易日的数据集。挂在主 pipeline 几小时之后跑：snapshot 类数据集一旦因源端中断丢掉当天窗口，第二天就补不回来了。": "Refetch only datasets still behind the last trading day. Run it a few hours after the main pipeline: once a snapshot dataset loses the day's window to a source outage, it cannot be recovered the next day."
"配合 --stale-only：只重抓 snapshot 类数据集；历史类留给下一次日更按日期补。": "With --stale-only: refetch only snapshot datasets; historical datasets are filled by date in the next daily update."
"只跑这些研究包对应的日更调度组，不跑事件流。不写则仍跑全部调度组和事件流。可重复。": "Run only the daily schedule groups for these research packs, without the event streams. If omitted, all schedule groups and event streams still run. Repeatable."
"[job.events.groups] 里的某一个组（默认按顺序跑全部）。": "One group from [job.events.groups] (default: run all in order)."
"as-of 自然日 YYYY-MM-DD（默认今天），含周末与节假日。": "As-of calendar date YYYY-MM-DD (default today), including weekends and holidays."
"重试指定的一次 run。": "Retry the given run."
"重试每个 daily 调度组最近一次失败的 run。": "Retry the most recent failed run of each daily schedule group."
"回环地址会同时监听 127.0.0.1 和 localhost。非回环地址必须配 --token。": "A loopback address listens on both 127.0.0.1 and localhost. A non-loopback address requires --token."
"要求这个 bearer token（或 ?token=）。--host 不是回环地址时必须设置。": "Require this bearer token (or ?token=). Required when --host is not a loopback address."
"只浏览。不注册操作页和存储清理的写入口。": "Browse only. Do not register the write endpoints of the operations page and storage cleanup."
"非回环地址上也可以从面板发起取数。默认远程只能浏览和做存储清理；令牌在网址里，局域网又是明文。": "Allow starting fetches from the dashboard on non-loopback addresses too. By default remote clients can only browse and run storage cleanup; the token is in the URL and the LAN is plaintext."
"包含价格、因子、身份、状态、日历及研究覆盖证据；缺少依赖时报错。": "Include prices, factors, identity, status, calendar and research coverage evidence; errors if dependencies are missing."
"要包含的数据集（可重复）。快照永远是显式指定的，不会是整个湖。": "Dataset to include (repeatable). Snapshots are always explicit, never the whole lake."
"快照放在哪；默认是数据根目录下的 meta/snapshots。": "Where to put the snapshot; defaults to meta/snapshots under the data root."
"只校验前置条件，不改动 TARGET。": "Only validate preconditions; do not modify TARGET."
"增量包放在哪；默认是数据根目录下的 meta/snapshots。": "Where to put the delta package; defaults to meta/snapshots under the data root."
"基线湖根目录。目标根目录会与它逐字节比对。": "Baseline lake root. The target root is compared against it byte for byte."
"目标湖根目录；默认取配置里当前生效的根目录。": "Target lake root; defaults to the currently active root in the config."
"用目标里已提交的 revision 作为基线前置条件。": "Use the revision committed in the target as the baseline precondition."
"要包含的数据集（可重复）。不给则自动发现两个根目录里都有的数据集。": "Dataset to include (repeatable). If omitted, auto-discover datasets present in both roots."
"归档编码；auto 优先 tar.zst，不行则退回 tar.gz。": "Archive encoding; auto prefers tar.zst and falls back to tar.gz."
"导入后的快照名；默认取归档文件名。": "Name of the imported snapshot; defaults to the archive file name."
"仅在归档校验通过之后，才替换已存在的同名快照。": "Replace an existing snapshot with the same name only after the archive passes verification."
"这次探测是从哪儿跑的 —— 'cn'、'overseas'，或你自己用的任何标签。有几个源拒绝非大陆出口，所以没有这个标签的结果没法解读。": "Where this probe runs from — 'cn', 'overseas', or any label you use. Some sources reject non-mainland egress, so results without this label cannot be interpreted."
"要探测的 key，逗号分隔；高成本/已受挑战的端点仅在显式列出时探测。": "Keys to probe, comma-separated; costly/challenged endpoints are probed only when listed explicitly."
"复用 12 小时内已校验的采集证据，只主动探测缺少新证据的端点。": "Reuse collection evidence verified within 12 hours; actively probe only endpoints lacking fresh evidence."
"离线列出探测源名称，不需要配置。": "List probe source names offline; no config needed."
"JSON 报告写到哪。默认写到湖内的 meta/source_health/<vantage>.json，`cne serve` 也从那里读。": "Where to write the JSON report. Defaults to meta/source_health/<vantage>.json in the lake, which `cne serve` also reads."
"核心数据集没有独立备份时退出 1。": "Exit 1 when a core dataset has no independent backup."
"把实测的探测可用率接到每个故障域上（会读湖）。": "Attach measured probe availability to each failure domain (reads the lake)."
"关键源的 SLO 未达标时退出 1。": "Exit 1 when a critical source misses its SLO."
"读哪个出口位置（vantage）的报告。": "Which egress location (vantage) report to read."
"现在实测，而不是读已存的报告。请求和 `sources probe` 相同。": "Measure now instead of reading the stored report. Makes the same requests as `sources probe`."
"只重算这些数据集（可重复）。其它数据集的行保持不变。": "Recompute only these datasets (repeatable). Rows for other datasets stay unchanged."
"除非统计建好之后又跑过采集，否则什么都不做。可以安全地挂定时器。": "Do nothing unless collection has run since the stats were built. Safe to put on a timer."
"以 JSON 打印结果。": "Print the result as JSON."
"某一个数据集的逐分区明细。": "Per-partition detail for one dataset."
"改为按 source / data_version 分组。": "Group by source / data_version instead."
"要看的 run id，或 'latest'（默认）。包含各数据集 stage 的结果。": "Run id to show, or 'latest' (default). Includes stage results per dataset."
"逐数据集的新鲜度：覆盖区间、水位，以及相对最后交易日是否陈旧。": "Per-dataset freshness: coverage range, watermark, and whether it is stale relative to the last trading day."
"配合 --datasets：打印数据集清单的全部列，而不只是新鲜度。": "With --datasets: print all columns of the dataset inventory, not just freshness."
? "配合 --datasets：只对这些调度组拥有的数据集判失败（空格或逗号分隔）。其它组的数据集照常列出、照常报为调度缺口，但不会让门禁失败。截面检查同样受它约束——daily_bars 归哪个组，它的覆盖率就归谁判。未跑完的 init 不属于任何调度组，始终判失败。"
: "With --datasets: fail only on datasets owned by these schedule groups (space- or comma-separated). Datasets of other groups are still listed and reported as schedule gaps but do not fail the gate. The cross-section check follows it too: daily_bars coverage is judged by whichever group owns it. An unfinished init belongs to no schedule group and always fails."
"配合 --datasets：是否做最新交易日的标的截面校验。它要读 daily_bars 的 tip 分区、instruments 和 trading_status，比单纯看水位贵；--no-scope 让这条命令回到纯元数据。": "With --datasets: whether to run the cross-sectional symbol check for the latest trading day. It reads the daily_bars tip partition, instruments and trading_status, which costs more than checking watermarks alone; --no-scope returns this command to pure metadata."
"按所选范围和新鲜度执行门禁；默认只报告。": "Enforce the gate for the selected scope and freshness; by default only reports."
"mark 原地标记；purge 已禁用，请转到 serve 存储运维页。": "mark marks in place; purge is disabled, use the serve storage operations page instead."
"兼容选项；不能绕过网页删除确认。": "Compatibility option; cannot bypass the web delete confirmation."
"存在多个封存版本时明确选择一个工件。": "Explicitly select one artifact when several sealed versions exist."
"起始报告期。": "Start report period."
"结束报告期。": "End report period."
"每个 staging 批次放多少只证券。": "Securities per staging batch."
"并发请求数。": "Number of concurrent requests."
"用逗号分隔的标的列表代替整个市场，定向重试失败证券；收尾 JSON 会在 `failed_symbols` 里列出仍未补齐的证券。": "Comma-separated symbols instead of the whole market, to retry failed securities; the final JSON lists securities still missing in `failed_symbols`."
"抓取哪一种对端快照。": "Which peer snapshot to fetch."
"K 线窗口，按自然日算。": "Bar window in calendar days."
"K 线抽样多少只证券。": "Number of securities to sample for bars."
"真正写入。不加它只报告差异，不改任何东西。": "Actually write. Without it, only report differences and change nothing."
"来自独立源的 (symbol, trade_date, close) parquet。": "Parquet of (symbol, trade_date, close) from an independent source."
"把有争议的行写到这里。": "Write disputed rows here."
"服务起点。": "Service start date."
"默认今天。": "Defaults to today."
"真正写入。不加它只抓取并报告，不改任何东西。": "Actually write. Without it, only fetch and report, changing nothing."
"只读验收衍生品研究窗口；需 --dataset、--start、--end。": "Read-only acceptance check of a derivatives research window; requires --dataset, --start, --end."
"改为检查「证券 × 交易日」，含窗口内一行都没有的证券。需要 --start。": "Check \"security × trading day\" instead, including securities with no rows at all in the window. Requires --start."
"改为检查连续交易日的运行证据，不补任何缺口。": "Check run evidence over consecutive trading days instead; fills no gaps."
"只校验这些数据集（逗号分隔）；默认校验注册表里的全部。": "Validate only these datasets (comma-separated); by default validates everything in the registry."
"把能补的缺口跑一遍回填，按数据集从新到旧。": "Run backfill over fillable gaps, dataset by dataset from newest to oldest."
"只看这些缺口类型：empty,stale,interior,shallow。": "Show only these gap types: empty,stale,interior,shallow."
"配合 --bars/--derivatives：覆盖窗口起点（含）。": "With --bars/--derivatives: coverage window start (inclusive)."
"覆盖窗口终点；--bars 默认上一个完整交易日，--derivatives 必填。": "Coverage window end; --bars defaults to the last complete trading day, required for --derivatives."
"配合 --runs：要求连续多少个交易日（默认 20）。": "With --runs: number of consecutive trading days required (default 20)."
"配合 --runs：截止日期 YYYY-MM-DD（含）。": "With --runs: cutoff date YYYY-MM-DD (inclusive)."
"配合 --runs：连续天数门禁没过就退出 1。": "With --runs: exit 1 if the consecutive-days gate fails."
"仅 --outstanding：单个 key 累计未补齐达到该次数后进入 parked 状态。后续 --outstanding 默认跳过，但 key 仍留在台账里。": "With --outstanding only: after a key has missed this many attempts it is parked. Later --outstanding runs skip it by default, but it stays in the ledger."
"仅 --outstanding：忽略尝试上限，把已 parked 的 key 也纳入本次修复。": "With --outstanding only: ignore the attempt cap and include parked keys in this repair."
