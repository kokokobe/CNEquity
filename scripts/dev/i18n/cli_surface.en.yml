# English for the CLI side-effect inventory (EFFECTS in scripts/dev/sync_docs.py),
# keyed by command path: [network, local effects].
audit: ["conditional", "Reads the lake and prints the audit; accesses sources when external comparison is enabled"]
backfill: ["when run", "Backfills history, writing staging and published data; --plan only reads config and state"]
check: ["none", "Reads status, freshness, audit results and stats; recomputes stale stats, --full reruns the full-lake audit"]
config: ["none", "create writes the personal config; upgrade backs up, then adds schedule steps; validate/diff only read"]
contract diff: ["none", "Reads contracts and prints the diff"]
contract show: ["none", "Reads the contract; writes a file when an output path is given"]
contract validate: ["none", "Validates the contract"]
decision-data cash-rights: ["none", "Reads the lake and prints decision data"]
decision-data payment-gaps: ["none", "Reads the lake and prints decision data"]
decision-data stock-terms: ["none", "Reads the lake and prints decision data"]
delisted status: ["none", "Reads delisting status"]
derive: ["conditional", "Writes derived data; modes such as adj_factors may access sources"]
doctor: ["none", "Checks config and environment offline"]
init: ["conditional", "sample is offline; demo/quick/full fetch data; layout-only creates directories"]
mcp: ["conditional", "Reads the lake by default; --live may fetch source data; --http listens on a local port"]
profile list: ["none", "Lists built-in scopes"]
profile show: ["none", "Shows a built-in scope"]
query: ["conditional", "SQL reads the lake; fetches data on an on-demand cache miss or refresh"]
repair corporate-action-gaps: ["with --apply", "Offline preview by default; --apply queries Baostock and CNINFO per gap, publishes a new version after verification and keeps the old one"]
repair layout: ["none", "Preview only by default; --apply publishes a new version, keeping the old version and duplicate-observation evidence"]
repair misdated-valuation: ["with --apply", "Offline preview by default; --apply fetches valuation for the replaced sessions from the EastMoney datacenter, publishes a new version after verification and keeps the old one"]
repair orphan-symbols: ["none", "Preview by default, may register an old-lake baseline version; --apply removes factor and corporate-action rows of securities without daily bars, publishes a new version and keeps the old one"]
repair status-listing-window: ["none", "Preview by default, may register an old-lake baseline version; --apply deletes status rows before a security's listing date or without a delisting on record, publishes a new version and keeps the old one"]
repair status-outages: ["none", "Preview by default, may register an old-lake baseline version; --apply rebuilds the EastMoney-outage carried rows in the window under the current rule, publishes a new version and keeps the old one"]
repair status-traded: ["none", "Read-only preview by default; --apply fills missing status keys from committed positive-volume bars, leaves ST unknown, publishes a new version and keeps the old one"]
repair fund-factors: ["none", "Read-only preview by default; --apply overlays recorded fund splits and transfers on the original vendor series, publishes through the repair gate and retains the old revision"]
repair fund-listing-dates: ["Requests current official ETF/LOF directories", "Preview by default; --apply archives source responses and fills unknown listing dates through the repair gate, retaining known dates and old revisions"]
repair stock-listing-dates: ["--refresh-sources only", "Replays IPO calendars offline by default; --apply fills stock listing dates confirmed by official listed events, publishes through the repair gate and retains old revisions"]
repair index-snapshots: ["--refresh-sources only", "Replays official files offline by default; --apply replaces complete dated constituent snapshots and real weights, publishes through the repair gate and retains old revisions"]
repair index-history: ["--refresh-sources only", "Replays the reviewed official attachment catalog for the selected SZSE Component or STAR 50 index offline by default; --apply replaces whole books on effective dates, retaining official dated weights and old revisions; unknown historical weights remain null"]
repair financial-originals: ["--refresh-sources only", "Replays original periodic reports offline by default; --apply appends identifiable current-period consolidated figures, publishes through the repair gate and retains existing vintages and honest observation times"]
repair missing-values: ["none", "Read-only preview by default; --apply replaces valuation zero placeholders and unavailable EastMoney/CNI weights with nulls, publishes through the repair gate and retains the old revision"]
repair financial-announcements: ["none", "Read-only preview by default; --apply appends financial reconstructions with LICO original-disclosure evidence, publishes through the repair gate and retains existing vintages"]
repair daily-bar-coverage: ["none", "Read-only preview by default; --apply retires BSE session debts and proven pre-listing debts using committed data and refreshes coverage watermarks, retaining evidence receipts without changing bars"]
repair stale-suspensions: ["none", "Preview by default, may register an old-lake baseline version; --apply removes inferred suspensions contradicted by traded daily bars, publishes a new version and keeps the old one"]
repair valuation-basis: ["none", "Preview only by default; --apply publishes a new version and keeps the old one"]
run clean: ["none", "Only previews expired files; an explicit --reconcile-runs may modify run state"]
run compact: ["none", "Publishes finished, unpublished staging data to the lake"]
run daily: ["when run", "Fetches incrementally and writes the lake; includes all schedule groups and event streams by default"]
run events: ["when run", "Fetches events and writes the lake"]
run retry: ["when run", "Retries failed scopes and writes the lake"]
serve: ["conditional", "Starts the lake dashboard. On a loopback address the operations page can start allowlisted fetches and daily updates; --read-only disables write endpoints; remote fetches require --allow-remote-ops; storage cleanup still needs web confirmation; fetch toggles are written back to the config, with a backup, after preview confirmation and do not start a fetch"]
snapshot create: ["none", "Creates a local snapshot"]
snapshot delta apply: ["none", "Applies a local delta package; --dry-run only validates"]
snapshot delta create: ["none", "Creates a local delta package"]
snapshot delta verify: ["none", "Verifies a local delta package"]
snapshot export: ["none", "Exports a local snapshot"]
snapshot import: ["none", "Imports a local snapshot"]
snapshot restore: ["none", "Restores a local snapshot to the target directory"]
snapshot verify: ["none", "Verifies a local snapshot"]
sources limits: ["none", "Reads egress budgets, cooldowns and local debt; does not probe sources"]
sources policy: ["none", "Reads source policies"]
sources probe: ["conditional", "--list is offline; probing accesses sources and writes a report"]
sources resilience: ["none", "Reads registered sources and probe evidence; may write a report"]
sources slo: ["none", "Reads probe history and writes stats"]
sources substitutes: ["conditional", "Reads reports by default; --probe accesses sources"]
stats rebuild: ["none", "Rebuilds local stats"]
stats show: ["none", "Reads local stats; recomputes automatically when stale or when a detail view needs it"]
status: ["none", "Reads run state and dataset coverage"]
storage archive: ["none", "Copies a registered experiment, verifies it file by file and registers the sealed artifact; keeps the source directory"]
storage artifact-verify: ["none", "Reads and verifies the full contents of a sealed artifact"]
storage experiment-create: ["none", "Creates an empty experiment directory with its own instance identity and registers it as active"]
storage experiment-seal: ["none", "Explicitly ends an experiment and binds a verified archive; once source content changes it cannot be cleaned up under the old seal"]
storage experiment-plan: ["none", "Validates references, the original directory and the archive, and saves an exit plan for the redundant original location"]
storage experiment-apply: ["none", "Only marks the experiment in place; CLI purge is disabled, deletion must be confirmed in the serve web UI"]
storage resolve: ["none", "Validates the archive location for an old path; does not rewrite reports"]
storage apply: ["none", "Rechecks the version plan and marks; CLI purge is disabled, deletion must be confirmed in the serve web UI"]
storage explain: ["none", "Reads the retention reasons for versions"]
storage hold: ["none", "Adds object protection and clears pending-deletion marks"]
storage import: ["none", "Validates and registers a reference manifest; only adds protection"]
storage inspect: ["none", "Reads versions, retention reasons and registered experiments"]
storage plan: ["none", "Validates retention dependencies and saves a version plan; deletes no data"]
ths-official backfill: ["when run", "Calls the credentialed source and fills gaps"]
ths-official capture: ["when run", "Calls the credentialed source and writes comparison evidence"]
ths-official repair-bars: ["when run", "Fetches even in a dry run; --apply writes repairs"]
ths-official resource-sectors: ["when run", "Fetches even in a dry run; --apply writes staging"]
verify: ["conditional", "Local validation by default; --repair accesses sources and repairs"]

repair adj-factors: ["--refresh-sources only", "Offline preview with a saved plan by default; --apply publishes supported corrections, retains old revisions and unresolved diagnostics, and saves bounded historical progress"]
repair fund-no-print: ["--refresh-sources only", "Offline preview by default; source refresh archives reports and updates caches; --apply approves explicit official fund auction-bar coverage evidence, retires corresponding debts and refreshes watermarks without creating bars or halt rows"]
repair fund-volume: ["only with --refresh-sources", "Offline preview by default; online refresh archives historical K-lines from the SSE quote service and reuses or collects EastMoney evidence when turnover conflicts; --apply repairs verified Shanghai and Shenzhen fund volume, passes publication checks and retains old revisions"]
